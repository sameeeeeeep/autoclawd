<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AutoClawd HQ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#1a0e05; }
  canvas { display:block; image-rendering:pixelated; cursor:grab; }
  canvas:active { cursor:grabbing; }
  #location-label {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(20,12,4,0.82); color:#f5d89a;
    font:bold 11px/1 "Courier New", monospace;
    padding:4px 12px; border-radius:10px;
    border:1px solid rgba(245,216,154,0.35);
    pointer-events:none; letter-spacing:1px;
    text-transform:uppercase;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="location-label">HOME</div>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// AutoClawd Pixel World  v3 — warm wood floors, detailed furniture, live bridge
// ─────────────────────────────────────────────────────────────────────────────

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const S = 4;           // pixel scale (each logical pixel = 4 CSS pixels)
const TW = 16, TH = 16; // tile size in logical pixels

// ─── Colour Palette ──────────────────────────────────────────────────────────
const C = {
  // Wood floors
  wf1:'#c8874a', wf2:'#b87840', wf3:'#d49a5c', wf4:'#a86830', wf5:'#e0aa6c',
  // Dark floor (lab tiles)
  df1:'#2a1f3a', df2:'#231a30', df3:'#321f44',
  // Walls
  wl1:'#4a3520', wl2:'#3a2810', wl3:'#5a4030',
  // Dark wall
  dw1:'#1e1428', dw2:'#160f1e',
  // Desk
  dk1:'#6b4c2a', dk2:'#7d5c36', dk3:'#8a6840', dk4:'#523818',
  // Monitor
  mn2:'#16213e', mn5:'#53c28b', mn7:'#4fc3f7',
  // Chair
  ch1:'#1a237e', ch2:'#283593', ch3:'#3949ab',
  // Plant
  pl1:'#2e7d32', pl2:'#388e3c', pl3:'#4caf50', pl4:'#5d4037',
  // Bookshelf
  bs1:'#4e342e', bs2:'#6d4c41', bs3:'#8d6e63',
  bk1:'#e53935', bk2:'#1976d2', bk3:'#388e3c', bk4:'#f57f17', bk5:'#6a1b9a',
  // Rug
  rg1:'#4a148c', rg2:'#6a1b9a', rg3:'#7b1fa2', rg4:'#9c27b0',
  // Skin
  sk1:'#ffcc99', sk2:'#f5b07a', sk3:'#e09060',
  // Hair
  hr1:'#2c1810', hr2:'#6b3d11', hr3:'#c6a35d', hr4:'#1a1a1a', hr5:'#e8c49a',
  // Clothing
  cl1:'#1565c0', cl2:'#2e7d32', cl4:'#b71c1c', cl5:'#00695c',
};

// ─── Tile Drawing Helpers ─────────────────────────────────────────────────────
function px(x, y, color, w, h) {
  if (!color) return;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, (w||1)*S, (h||1)*S);
}

function drawTile(tx, ty, tileId) {
  const x = tx * TW * S, y = ty * TH * S;
  switch (tileId) {
    case 'wf': drawWoodFloor(x, y);   break;
    case 'df': drawDarkFloor(x, y);   break;
    case 'wl': drawWall(x, y);        break;
    case 'dw': drawDarkWall(x, y);    break;
    case 'ds': drawDesk(x, y);        break;
    case 'mn': drawMonitor(x, y);     break;
    case 'ch': drawChair(x, y);       break;
    case 'pl': drawPlant(x, y);       break;
    case 'bs': drawBookshelf(x, y);   break;
    case 'rg': drawRug(x, y);         break;
    case 'rc': drawRugCenter(x, y);   break;
    case 'sr': drawServer(x, y);      break;
    case 'wc': drawWaterCooler(x, y); break;
    case 'la': drawLamp(x, y);        break;
    case 'ck': drawClock(x, y);       break;
  }
}

function drawWoodFloor(x, y) {
  ctx.fillStyle = C.wf1; ctx.fillRect(x, y, TW*S, TH*S);
  ctx.fillStyle = C.wf4;
  for (const r of [4, 8, 12]) ctx.fillRect(x, y+r*S, TW*S, S);
  ctx.fillStyle = C.wf2;
  ctx.fillRect(x+2*S, y+S, S, 3*S);
  ctx.fillRect(x+10*S, y+5*S, S, 3*S);
  ctx.fillRect(x+6*S, y+9*S, S, 3*S);
  ctx.fillStyle = C.wf5;
  ctx.fillRect(x, y, TW*S, S);
  ctx.fillRect(x, y+4*S, TW*S, S);
}

function drawDarkFloor(x, y) {
  for (let r=0; r<16; r++) for (let c=0; c<16; c++) {
    ctx.fillStyle = ((r+c)%2===0) ? C.df1 : (c%2 ? C.df2 : C.df3);
    ctx.fillRect(x+c*S, y+r*S, S, S);
  }
}

function drawWall(x, y) {
  ctx.fillStyle = C.wl1; ctx.fillRect(x, y, TW*S, TH*S);
  ctx.fillStyle = C.wl2;
  for (let r=0; r<4; r++) {
    const off = (r%2)*8;
    for (let c=0; c<3; c++) ctx.fillRect(x+(off+c*16)*S, y+r*4*S, 14*S, 3*S);
  }
  ctx.fillStyle = C.wl3; ctx.fillRect(x, y, TW*S, S);
}

function drawDarkWall(x, y) {
  ctx.fillStyle = C.dw1; ctx.fillRect(x, y, TW*S, TH*S);
  ctx.fillStyle = C.dw2;
  for (let r=0; r<4; r++) ctx.fillRect(x, y+r*4*S, TW*S, S);
}

function drawDesk(x, y) {
  px(x+S,    y+9*S, C.dk4, 2, 7);
  px(x+13*S, y+9*S, C.dk4, 2, 7);
  ctx.fillStyle = C.dk1; ctx.fillRect(x, y+6*S, TW*S, 4*S);
  ctx.fillStyle = C.dk2; ctx.fillRect(x, y+6*S, TW*S, S);
  ctx.fillStyle = C.dk3; ctx.fillRect(x, y+6*S, S, 4*S);
  ctx.fillStyle = '#c8cdd2'; ctx.fillRect(x+3*S, y+8*S, 8*S, 2*S);
  ctx.fillStyle = '#9aa0a6'; ctx.fillRect(x+3*S, y+9*S, 8*S, S);
  ctx.fillStyle = '#c8cdd2'; ctx.fillRect(x+12*S, y+8*S, 2*S, 2*S);
}

function drawMonitor(x, y) {
  ctx.fillStyle = '#555'; ctx.fillRect(x+6*S, y+12*S, 4*S, 3*S);
  ctx.fillStyle = '#444'; ctx.fillRect(x+4*S, y+14*S, 8*S, 2*S);
  ctx.fillStyle = '#222'; ctx.fillRect(x+S, y+S, 14*S, 12*S);
  ctx.fillStyle = C.mn2; ctx.fillRect(x+2*S, y+2*S, 12*S, 10*S);
  ctx.fillStyle = C.mn5;
  ctx.fillRect(x+3*S, y+3*S, 7*S, S);
  ctx.fillRect(x+3*S, y+5*S, 5*S, S);
  ctx.fillRect(x+3*S, y+7*S, 8*S, S);
  ctx.fillStyle = C.mn7; ctx.fillRect(x+3*S, y+9*S, 4*S, S);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x+11*S, y+9*S, S, S);
}

function drawChair(x, y) {
  ctx.fillStyle = C.ch1; ctx.fillRect(x+2*S, y, 12*S, 8*S);
  ctx.fillStyle = C.ch2; ctx.fillRect(x+2*S, y, 12*S, S);
  ctx.fillStyle = C.ch3; ctx.fillRect(x+2*S, y, S, 8*S);
  ctx.fillStyle = C.ch2; ctx.fillRect(x+S, y+8*S, 14*S, 4*S);
  ctx.fillStyle = C.ch1;
  ctx.fillRect(x, y+6*S, 2*S, 5*S);
  ctx.fillRect(x+14*S, y+6*S, 2*S, 5*S);
  ctx.fillStyle = '#555';
  ctx.fillRect(x+2*S, y+12*S, 2*S, 4*S);
  ctx.fillRect(x+12*S, y+12*S, 2*S, 4*S);
}

function drawPlant(x, y) {
  ctx.fillStyle = '#795548'; ctx.fillRect(x+4*S, y+11*S, 8*S, 5*S);
  ctx.fillStyle = '#6d4c41'; ctx.fillRect(x+3*S, y+10*S, 10*S, 2*S);
  ctx.fillStyle = '#3e2723'; ctx.fillRect(x+4*S, y+10*S, 8*S, S);
  ctx.fillStyle = C.pl4; ctx.fillRect(x+7*S, y+6*S, 2*S, 5*S);
  ctx.fillStyle = C.pl3;
  ctx.fillRect(x+3*S, y+3*S, 4*S, 4*S);
  ctx.fillRect(x+9*S, y+4*S, 4*S, 3*S);
  ctx.fillRect(x+5*S, y+S, 5*S, 4*S);
  ctx.fillStyle = C.pl2;
  ctx.fillRect(x+4*S, y+4*S, 3*S, 3*S);
  ctx.fillRect(x+9*S, y+5*S, 3*S, 2*S);
  ctx.fillRect(x+6*S, y+2*S, 4*S, 3*S);
  ctx.fillStyle = C.pl1;
  ctx.fillRect(x+5*S, y+5*S, 2*S, 2*S);
}

function drawBookshelf(x, y) {
  ctx.fillStyle = C.bs1; ctx.fillRect(x, y, TW*S, TH*S);
  ctx.fillStyle = C.bs2;
  ctx.fillRect(x, y+5*S, TW*S, S);
  ctx.fillRect(x, y+10*S, TW*S, S);
  const bk = [C.bk1,C.bk2,C.bk3,C.bk4,C.bk5,C.bk1,C.bk3];
  for (let i=0; i<7; i++) {
    ctx.fillStyle = bk[i];
    ctx.fillRect(x+(i*2+1)*S, y+S, 2*S, 4*S);
  }
  const bk2 = [C.bk2,C.bk4,C.bk5,C.bk1,C.bk3,C.bk2,C.bk4];
  for (let i=0; i<7; i++) {
    ctx.fillStyle = bk2[i];
    ctx.fillRect(x+(i*2+1)*S, y+6*S, 2*S, 4*S);
  }
  ctx.fillStyle = C.bs3;
  ctx.fillRect(x, y, S, TH*S);
  ctx.fillRect(x+15*S, y, S, TH*S);
}

function drawRug(x, y) {
  ctx.fillStyle = C.rg1; ctx.fillRect(x, y, TW*S, TH*S);
  ctx.fillStyle = C.rg2; ctx.fillRect(x+S, y+S, 14*S, 14*S);
  ctx.fillStyle = C.rg3; ctx.fillRect(x+2*S, y+2*S, 12*S, 12*S);
}

function drawRugCenter(x, y) {
  ctx.fillStyle = C.rg3; ctx.fillRect(x, y, TW*S, TH*S);
  ctx.fillStyle = C.rg4; ctx.fillRect(x+4*S, y+4*S, 8*S, 8*S);
  ctx.fillStyle = C.rg2;
  ctx.fillRect(x+7*S, y, 2*S, TH*S);
  ctx.fillRect(x, y+7*S, TW*S, 2*S);
}

function drawServer(x, y) {
  ctx.fillStyle = '#1c1c1c'; ctx.fillRect(x, y, TW*S, TH*S);
  for (let r=0; r<4; r++) {
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(x+S, y+(r*4+1)*S, 14*S, 3*S);
    ctx.fillStyle = r===1 ? '#00e676' : '#1de9b6';
    ctx.fillRect(x+13*S, y+(r*4+2)*S, S, S);
    ctx.fillStyle = '#00b0ff';
    ctx.fillRect(x+11*S, y+(r*4+2)*S, S, S);
  }
}

function drawWaterCooler(x, y) {
  ctx.fillStyle = 'rgba(120,180,255,0.7)';
  ctx.fillRect(x+5*S, y, 6*S, 8*S);
  ctx.fillStyle = '#bcd8f5'; ctx.fillRect(x+5*S, y, 6*S, 2*S);
  ctx.fillStyle = '#e0e0e0'; ctx.fillRect(x+4*S, y+7*S, 8*S, 9*S);
  ctx.fillStyle = '#bdbdbd'; ctx.fillRect(x+4*S, y+14*S, 8*S, 2*S);
  ctx.fillStyle = '#ef5350'; ctx.fillRect(x+5*S, y+10*S, 2*S, 2*S);
  ctx.fillStyle = '#42a5f5'; ctx.fillRect(x+9*S, y+10*S, 2*S, 2*S);
}

function drawLamp(x, y) {
  ctx.fillStyle = '#666'; ctx.fillRect(x+7*S, y+4*S, 2*S, 12*S);
  ctx.fillStyle = '#555'; ctx.fillRect(x+4*S, y+14*S, 8*S, 2*S);
  ctx.fillStyle = '#f5d042'; ctx.fillRect(x+3*S, y, 10*S, 5*S);
  ctx.fillStyle = '#fff9c4'; ctx.fillRect(x+4*S, y, 8*S, 2*S);
  ctx.fillStyle = 'rgba(255,240,100,0.12)';
  ctx.fillRect(x-2*S, y+3*S, 20*S, 8*S);
}

function drawClock(x, y) {
  ctx.fillStyle = '#4e342e'; ctx.fillRect(x, y, TW*S, TH*S);
  ctx.fillStyle = '#f5f5f5'; ctx.fillRect(x+2*S, y+2*S, 12*S, 12*S);
  ctx.fillStyle = '#efebe9'; ctx.fillRect(x+3*S, y+3*S, 10*S, 10*S);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(x+8*S, y+4*S, S, 5*S);
  ctx.fillRect(x+8*S, y+8*S, 4*S, S);
  ctx.fillStyle = '#e53935'; ctx.fillRect(x+8*S, y+5*S, S, 4*S);
  ctx.fillStyle = '#555';
  ctx.fillRect(x+7*S, y+3*S, 2*S, S);
  ctx.fillRect(x+7*S, y+12*S, 2*S, S);
  ctx.fillRect(x+3*S, y+7*S, S, 2*S);
  ctx.fillRect(x+12*S, y+7*S, S, 2*S);
}

// ─── World Map ────────────────────────────────────────────────────────────────
const MAP_W = 28, MAP_H = 20;
let TMAP = [];

function setTile(r, c, type, blocking) {
  if (r>=0 && r<MAP_H && c>=0 && c<MAP_W)
    TMAP[r][c] = { type, blocking: blocking||false };
}

function initMap() {
  for (let r=0; r<MAP_H; r++) {
    TMAP[r] = [];
    for (let c=0; c<MAP_W; c++) TMAP[r][c] = { type:'', blocking:false };
  }

  // ── Mission Control (warm wood) ───────────────────────────────────────────
  for (let r=1; r<MAP_H-1; r++) for (let c=1; c<9; c++) setTile(r,c,'wf');
  for (let c=0; c<10; c++) { setTile(0,c,'wl',true); setTile(MAP_H-1,c,'wl',true); }
  for (let r=0; r<MAP_H; r++) setTile(r,0,'wl',true);
  // Rug
  for (let r=7; r<13; r++) for (let c=2; c<8; c++)
    setTile(r,c,(r===9||r===10)&&(c===4||c===5)?'rc':'rg');
  // MC furniture
  setTile(2,2,'ch',true); setTile(2,3,'ds',true); setTile(2,4,'mn',true);
  setTile(2,7,'pl',true);
  setTile(1,1,'ck',true);
  setTile(14,2,'ch',true); setTile(14,3,'ds',true); setTile(14,4,'mn',true);
  setTile(17,2,'ch',true); setTile(17,3,'ds',true); setTile(17,4,'mn',true);
  setTile(17,7,'wc',true);
  setTile(3,7,'la',true);

  // ── Corridor 1 (col 9) ──────────────────────────────────────────────────
  for (let r=0; r<MAP_H; r++) setTile(r,9,'wf');
  setTile(0,9,'wl',true); setTile(MAP_H-1,9,'wl',true);

  // ── Claude Lab (dark floor) ───────────────────────────────────────────────
  for (let r=1; r<MAP_H-1; r++) for (let c=10; c<19; c++) setTile(r,c,'df');
  for (let c=10; c<19; c++) { setTile(0,c,'dw',true); setTile(MAP_H-1,c,'dw',true); }
  // Server racks
  for (let r=2; r<8; r++) { setTile(r,10,'sr',true); setTile(r,11,'sr',true); }
  // Lab desks
  setTile(2,13,'ch',true);  setTile(2,14,'ds',true);  setTile(2,15,'mn',true);  setTile(2,16,'mn',true);
  setTile(10,13,'ch',true); setTile(10,14,'ds',true); setTile(10,15,'mn',true);
  setTile(14,13,'ch',true); setTile(14,14,'ds',true); setTile(14,15,'mn',true); setTile(14,16,'mn',true);
  setTile(3,17,'pl',true);  setTile(12,17,'pl',true);

  // ── Corridor 2 (col 19) ─────────────────────────────────────────────────
  for (let r=0; r<MAP_H; r++) setTile(r,19,'wf');
  setTile(0,19,'wl',true); setTile(MAP_H-1,19,'wl',true);

  // ── Archive (warm wood) ───────────────────────────────────────────────────
  for (let r=1; r<MAP_H-1; r++) for (let c=20; c<MAP_W; c++) setTile(r,c,'wf');
  for (let c=20; c<MAP_W; c++) { setTile(0,c,'wl',true); setTile(MAP_H-1,c,'wl',true); }
  for (let r=0; r<MAP_H; r++) setTile(r,MAP_W-1,'wl',true);
  // Bookshelves
  for (let r=1; r<MAP_H-1; r++) setTile(r,MAP_W-2,'bs',true);
  // Archive desks
  setTile(3,21,'ch',true);  setTile(3,22,'ds',true);  setTile(3,23,'mn',true);
  setTile(12,21,'ch',true); setTile(12,22,'ds',true); setTile(12,23,'mn',true);
  setTile(16,21,'wc',true);
  setTile(6,24,'la',true);
}

// ─── BFS ─────────────────────────────────────────────────────────────────────
function isWalkable(r, c) {
  if (r<0||r>=MAP_H||c<0||c>=MAP_W) return false;
  return !TMAP[r][c].blocking;
}

function bfs(sr, sc, er, ec) {
  if (!isWalkable(er,ec)) return [];
  const visited = new Set(), q = [[sr,sc,[]]];
  visited.add(sr*MAP_W+sc);
  while (q.length) {
    const [r,c,path] = q.shift();
    if (r===er&&c===ec) return path;
    for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      const nr=r+dr, nc=c+dc, key=nr*MAP_W+nc;
      if (isWalkable(nr,nc)&&!visited.has(key)) {
        visited.add(key); q.push([nr,nc,[...path,[nr,nc]]]);
      }
    }
  }
  return [];
}

// ─── Sprite Drawing ───────────────────────────────────────────────────────────
function drawHumanSprite(x, y, hair, skin, shirt, pants, frame) {
  const f  = frame % 2;
  const bob= (frame%4<2) ? 0 : S;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(x+S, y+12*S+bob, 6*S, S);
  // Pants
  ctx.fillStyle=pants; ctx.fillRect(x+2*S, y+8*S+bob, 4*S, 4*S);
  // Shoes
  ctx.fillStyle='#1a1a1a';
  if (f===0) {
    ctx.fillRect(x+2*S,y+11*S+bob,2*S,S); ctx.fillRect(x+4*S,y+11*S+bob,2*S,S);
  } else {
    ctx.fillRect(x+S,  y+11*S+bob,2*S,S); ctx.fillRect(x+5*S,y+11*S+bob,2*S,S);
  }
  // Shirt
  ctx.fillStyle=shirt; ctx.fillRect(x+2*S, y+5*S+bob, 4*S, 4*S);
  // Arms
  ctx.fillStyle=shirt;
  ctx.fillRect(x+S,   y+(f?6:5)*S+bob, S, 4*S);
  ctx.fillRect(x+6*S, y+(f?4:5)*S+bob, S, 4*S);
  // Hands
  ctx.fillStyle=skin;
  ctx.fillRect(x+S,  y+(f?9:8)*S+bob, S, S);
  ctx.fillRect(x+6*S,y+(f?7:8)*S+bob, S, S);
  // Neck
  ctx.fillStyle=skin; ctx.fillRect(x+3*S, y+4*S+bob, 2*S, S);
  // Head
  ctx.fillStyle=skin; ctx.fillRect(x+2*S, y+S+bob, 4*S, 4*S);
  // Hair
  ctx.fillStyle=hair;
  ctx.fillRect(x+2*S, y+bob,   4*S, 2*S);
  ctx.fillRect(x+S,   y+S+bob, S,   2*S);
  ctx.fillRect(x+6*S, y+S+bob, S,   2*S);
  // Eyes
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(x+3*S, y+2*S+bob, S, S);
  ctx.fillRect(x+5*S, y+2*S+bob, S, S);
}

function drawDotSprite(x, y, frame) {
  const bob=(frame%4<2)?0:S;
  // Glow halo
  ctx.fillStyle='rgba(167,139,250,0.12)'; ctx.fillRect(x-S, y-S+bob, 10*S, 14*S);
  // Ghost body
  ctx.fillStyle='#7c3aed'; ctx.fillRect(x+2*S, y+6*S+bob, 4*S, 4*S);
  ctx.fillStyle='#8b5cf6'; ctx.fillRect(x+S, y+4*S+bob, 6*S, 4*S);
  // Wiggly bottom
  if (frame%2===0) {
    px(x+S,  y+9*S+bob,'#7c3aed'); px(x+3*S,y+10*S+bob,'#8b5cf6'); px(x+5*S,y+9*S+bob,'#7c3aed');
  } else {
    px(x+2*S,y+10*S+bob,'#7c3aed');px(x+4*S,y+9*S+bob,'#8b5cf6'); px(x+6*S,y+10*S+bob,'#7c3aed');
  }
  // Head
  ctx.fillStyle='#a78bfa'; ctx.fillRect(x+2*S, y+bob, 4*S, 5*S);
  // Eyes
  ctx.fillStyle='#06b6d4';
  ctx.fillRect(x+2*S,y+2*S+bob,2*S,2*S); ctx.fillRect(x+5*S,y+2*S+bob,2*S,2*S);
  ctx.fillStyle='#fff';
  ctx.fillRect(x+2*S,y+2*S+bob,S,S);     ctx.fillRect(x+5*S,y+2*S+bob,S,S);
  // Antenna
  ctx.fillStyle='#c4b5fd'; ctx.fillRect(x+4*S, y-2*S+bob, S, 3*S);
  ctx.fillStyle='#e9d5ff'; ctx.fillRect(x+4*S, y-3*S+bob, S, S);
}

function drawClawdSprite(x, y, frame) {
  const bob=(frame%4<2)?0:S;
  ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(x, y+12*S+bob, 8*S, S);
  // Body
  ctx.fillStyle='#ea580c'; ctx.fillRect(x+S, y+4*S+bob, 6*S, 6*S);
  ctx.fillStyle='#f97316'; ctx.fillRect(x+2*S, y+4*S+bob, 4*S, 4*S);
  // Claws
  ctx.fillStyle='#c2410c';
  ctx.fillRect(x,    y+(frame%2?5:4)*S+bob, S, 3*S);
  ctx.fillRect(x+7*S,y+(frame%2?3:4)*S+bob, S, 3*S);
  // Legs
  ctx.fillStyle='#ea580c';
  ctx.fillRect(x+2*S,y+9*S+bob,2*S,3*S); ctx.fillRect(x+4*S,y+9*S+bob,2*S,3*S);
  // Head
  ctx.fillStyle='#f97316'; ctx.fillRect(x+2*S, y+S+bob, 4*S, 4*S);
  // Eye stalks + eyes
  ctx.fillStyle='#ea580c';
  ctx.fillRect(x+S,  y+bob, S, 2*S); ctx.fillRect(x+6*S, y+bob, S, 2*S);
  ctx.fillStyle='#1d4ed8';
  ctx.fillRect(x+S,  y+bob, S, S);   ctx.fillRect(x+6*S, y+bob, S, S);
  ctx.fillStyle='#93c5fd';
  ctx.fillRect(x+S,  y+S+bob,S,S);   ctx.fillRect(x+6*S, y+S+bob,S,S);
  // Shell highlight
  ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(x+3*S, y+5*S+bob, 2*S, S);
}

function drawTaskBotSprite(x, y, frame) {
  const bob=(frame%4<2)?0:S;
  ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(x+S, y+13*S+bob, 6*S, S);
  // Legs
  ctx.fillStyle='#475569';
  ctx.fillRect(x+2*S,y+(frame%2?10:9)*S+bob,2*S,4*S);
  ctx.fillRect(x+5*S,y+(frame%2?9:10)*S+bob,2*S,4*S);
  ctx.fillStyle='#334155';
  ctx.fillRect(x+2*S,y+12*S+bob,2*S,S); ctx.fillRect(x+5*S,y+12*S+bob,2*S,S);
  // Torso
  ctx.fillStyle='#64748b'; ctx.fillRect(x+S, y+5*S+bob, 6*S, 5*S);
  ctx.fillStyle='#475569'; ctx.fillRect(x+S, y+5*S+bob, 6*S, S);
  // Chest panel
  ctx.fillStyle='#0f172a'; ctx.fillRect(x+2*S,y+6*S+bob,4*S,3*S);
  ctx.fillStyle='#22d3ee'; ctx.fillRect(x+3*S,y+7*S+bob,S,S);
  ctx.fillStyle='#4ade80'; ctx.fillRect(x+5*S,y+7*S+bob,S,S);
  // Arms
  ctx.fillStyle='#64748b';
  ctx.fillRect(x,    y+5*S+bob,S,4*S); ctx.fillRect(x+7*S,y+5*S+bob,S,4*S);
  // Head
  ctx.fillStyle='#64748b'; ctx.fillRect(x+2*S,y+S+bob,4*S,5*S);
  ctx.fillStyle='#475569'; ctx.fillRect(x+2*S,y+S+bob,4*S,S);
  // Visor
  ctx.fillStyle='#0ea5e9'; ctx.fillRect(x+3*S,y+2*S+bob,3*S,2*S);
  ctx.fillStyle='rgba(186,230,253,0.7)'; ctx.fillRect(x+3*S,y+2*S+bob,3*S,S);
  // Antenna
  ctx.fillStyle='#94a3b8'; ctx.fillRect(x+5*S,y-S+bob,S,3*S);
  ctx.fillStyle='#f59e0b'; ctx.fillRect(x+5*S,y-S+bob,S,S);
}

// ─── Characters ───────────────────────────────────────────────────────────────
const CHARS = [
  { id:'dot',       r:9,  c:4,  type:'dot',     name:'Dot',       wr:9,  wc:4  },
  { id:'writer',    r:3,  c:2,  type:'human',   name:'Writer',    wr:3,  wc:2,  hair:C.hr1, skin:C.sk1, shirt:C.cl1, pants:'#37474f' },
  { id:'analyst1',  r:15, c:3,  type:'human',   name:'Analyst',   wr:15, wc:3,  hair:C.hr2, skin:C.sk2, shirt:C.cl2, pants:'#4e342e' },
  { id:'analyst2',  r:18, c:3,  type:'human',   name:'A2',        wr:18, wc:3,  hair:C.hr3, skin:C.sk3, shirt:C.cl5, pants:'#212121' },
  { id:'clawd',     r:11, c:14, type:'clawd',   name:"Claw'd",    wr:11, wc:14 },
  { id:'taskbot',   r:3,  c:15, type:'taskbot', name:'TaskBot',   wr:3,  wc:15 },
  { id:'wabot',     r:15, c:15, type:'human',   name:'WA-Bot',    wr:15, wc:15, hair:C.hr4, skin:C.sk1, shirt:'#25d366', pants:'#1a1a1a' },
  { id:'archivist', r:4,  c:22, type:'human',   name:'Archivist', wr:4,  wc:22, hair:C.hr5, skin:C.sk2, shirt:C.cl4, pants:'#37474f' },
];

CHARS.forEach(ch => {
  ch.px = ch.c * TW * S;
  ch.py = ch.r * TH * S;
  ch.frame = Math.floor(Math.random()*4);
  ch.frameTimer = 0;
  ch.state = 'idle';
  ch.bubble = null;
  ch.stateTimer = 0;
  ch.path = [];
  ch.pathIdx = 0;
});

function charById(id) { return CHARS.find(c => c.id === id); }

// ─── Camera ───────────────────────────────────────────────────────────────────
let cam = { x:0, y:0, targetX:0, targetY:0 };
let drag = { active:false, startX:0, startY:0, cx:0, cy:0 };

function clampCam() {
  const maxX = MAP_W*TW*S - canvas.width;
  const maxY = MAP_H*TH*S - canvas.height;
  cam.targetX = Math.max(0, Math.min(maxX||0, cam.targetX));
  cam.targetY = Math.max(0, Math.min(maxY||0, cam.targetY));
}

window.focusOn = function(id) {
  const ch = charById(id);
  if (!ch) return;
  cam.targetX = ch.px + 4*S - canvas.width/2;
  cam.targetY = ch.py + 6*S - canvas.height/2;
  clampCam();
};

// ─── Pipeline State ───────────────────────────────────────────────────────────
let pipeline = { stage:0, stageTimer:0, taskTitle:'', taskMode:'ask' };

// ─── Event API (called from Swift via evaluateJavaScript) ─────────────────────
window.receiveEvent = function(type, data) {
  const dot       = charById('dot');
  const writer    = charById('writer');
  const analyst1  = charById('analyst1');
  const analyst2  = charById('analyst2');
  const clawd     = charById('clawd');
  const taskbot   = charById('taskbot');
  const wabot     = charById('wabot');
  const archivist = charById('archivist');

  switch (type) {
    case 'transcript':
      pipeline.stage=1; pipeline.stageTimer=2500;
      if (dot)    { dot.state='excited';    dot.stateTimer=2000; dot.bubble={text:'Heard it!',timer:2000}; }
      if (writer) { writer.state='work';    writer.stateTimer=3000; }
      break;
    case 'cleaning':
      pipeline.stage=2; pipeline.stageTimer=data.duration||3000;
      if (analyst1) { analyst1.state='work'; analyst1.stateTimer=data.duration||3000; analyst1.bubble={text:'Cleaning...',timer:2500}; }
      break;
    case 'analysis':
      pipeline.stage=3; pipeline.stageTimer=data.duration||4000;
      if (analyst2) { analyst2.state='work'; analyst2.stateTimer=data.duration||4000; analyst2.bubble={text:'Analysing...',timer:2500}; }
      break;
    case 'task_created':
      pipeline.stage=4; pipeline.stageTimer=3000;
      pipeline.taskTitle = data.title||'Task';
      if (dot)     { dot.bubble={text:'Task ready!',timer:3000}; }
      if (taskbot) { taskbot.state='excited'; taskbot.stateTimer=3000; taskbot.bubble={text:data.title||'Task',timer:3000}; }
      break;
    case 'task_executing':
      pipeline.stage=5; pipeline.stageTimer=10000;
      if (clawd)   { clawd.state='work';    clawd.stateTimer=8000; clawd.bubble={text:'On it!',timer:8000}; }
      if (taskbot) moveTo(taskbot,11,14);
      break;
    case 'task_done':
      pipeline.stage=6; pipeline.stageTimer=3000;
      if (clawd)     { clawd.state='excited';     clawd.stateTimer=2000;     clawd.bubble={text:'Done!',    timer:2000}; }
      if (archivist) { archivist.state='excited'; archivist.stateTimer=2000; archivist.bubble={text:'Archived!',timer:2000}; }
      break;
    case 'whatsapp':
      if (wabot) { wabot.state='excited'; wabot.stateTimer=3000; wabot.bubble={text:'WA msg!',timer:3000}; }
      break;
    case 'reset':
      pipeline.stage=0;
      CHARS.forEach(ch => { ch.state='idle'; ch.bubble=null; returnToWork(ch); });
      break;
  }
};

window.setLocation = function(name) {
  const el = document.getElementById('location-label');
  if (el && name) el.textContent = name.toUpperCase();
};

// ─── Character Movement ───────────────────────────────────────────────────────
function moveTo(ch, tr, tc) {
  const cr = Math.round(ch.py/(TH*S)), cc = Math.round(ch.px/(TW*S));
  const path = bfs(cr, cc, tr, tc);
  if (path.length) { ch.path=path; ch.pathIdx=0; ch.state='walk'; }
}

function returnToWork(ch) { moveTo(ch, ch.wr, ch.wc); }

function updateChar(ch, dt) {
  ch.frameTimer += dt;
  if (ch.frameTimer > 180) { ch.frame++; ch.frameTimer=0; }

  if (ch.bubble) { ch.bubble.timer -= dt; if (ch.bubble.timer<=0) ch.bubble=null; }
  if (ch.stateTimer>0) {
    ch.stateTimer -= dt;
    if (ch.stateTimer<=0 && ch.state!=='walk') ch.state='idle';
  }

  if (ch.path.length && ch.pathIdx < ch.path.length) {
    ch.state = 'walk';
    const [tr,tc] = ch.path[ch.pathIdx];
    const tx=tc*TW*S, ty=tr*TH*S;
    const spd=1.5*S, dx=tx-ch.px, dy=ty-ch.py;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if (dist < spd) {
      ch.px=tx; ch.py=ty; ch.pathIdx++;
      if (ch.pathIdx>=ch.path.length) { ch.path=[]; ch.state=ch.stateTimer>0?'work':'idle'; }
    } else {
      ch.px += (dx/dist)*spd; ch.py += (dy/dist)*spd;
    }
  }

  // Occasional idle wander
  if (ch.state==='idle' && Math.random()<0.0004) {
    const cr=Math.round(ch.py/(TH*S)), cc=Math.round(ch.px/(TW*S));
    const nr=cr+Math.floor(Math.random()*3)-1, nc=cc+Math.floor(Math.random()*3)-1;
    if (isWalkable(nr,nc)) moveTo(ch,nr,nc);
  }
}

// ─── Draw World ───────────────────────────────────────────────────────────────
function drawWorld() {
  ctx.fillStyle='#1a0e05'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));

  // Tiles
  for (let r=0; r<MAP_H; r++) {
    for (let c=0; c<MAP_W; c++) {
      const t = TMAP[r][c];
      if (t.type) { drawTile(c,r,t.type); continue; }
      // Bare floor colour per room zone
      if      (c<9)  ctx.fillStyle=C.wf1;
      else if (c<10) ctx.fillStyle=C.wf3;
      else if (c<19) ctx.fillStyle=C.df1;
      else if (c<20) ctx.fillStyle=C.wf3;
      else           ctx.fillStyle=C.wf1;
      ctx.fillRect(c*TW*S, r*TH*S, TW*S, TH*S);
    }
  }

  // Divider shadows
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(9*TW*S, 0, S, MAP_H*TH*S);
  ctx.fillRect(19*TW*S, 0, S, MAP_H*TH*S);

  // Room labels (subtle, bottom of each room)
  ctx.font = `bold ${3*S}px "Courier New", monospace`;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(245,216,154,0.35)';
  ctx.fillText('MISSION CONTROL', 4.5*TW*S, (MAP_H-1)*TH*S - 2*S);
  ctx.fillStyle = 'rgba(99,179,237,0.35)';
  ctx.fillText('CLAUDE LAB', 14.5*TW*S, (MAP_H-1)*TH*S - 2*S);
  ctx.fillStyle = 'rgba(154,230,180,0.35)';
  ctx.fillText('ARCHIVE', 23.5*TW*S, (MAP_H-1)*TH*S - 2*S);
  ctx.textAlign = 'left';

  // Characters (painter's sort by y)
  const sorted = [...CHARS].sort((a,b) => a.py-b.py);
  for (const ch of sorted) {
    switch (ch.type) {
      case 'dot':     drawDotSprite(ch.px, ch.py, ch.frame); break;
      case 'clawd':   drawClawdSprite(ch.px, ch.py, ch.frame); break;
      case 'taskbot': drawTaskBotSprite(ch.px, ch.py, ch.frame); break;
      default: drawHumanSprite(ch.px, ch.py,
        ch.hair||C.hr1, ch.skin||C.sk1, ch.shirt||C.cl1, ch.pants||'#37474f',
        ch.state==='walk'?ch.frame:0);
    }

    // Name tag (when active or has bubble)
    if (ch.state!=='idle' || ch.bubble) {
      ctx.font = `${2*S}px "Courier New", monospace`;
      ctx.textAlign='center';
      const tw = ctx.measureText(ch.name).width;
      ctx.fillStyle='rgba(0,0,0,0.6)';
      ctx.fillRect(ch.px+4*S - tw/2 - S, ch.py-4*S, tw+2*S, 3*S);
      ctx.fillStyle='#f5f5f5';
      ctx.fillText(ch.name, ch.px+4*S, ch.py-2*S);
      ctx.textAlign='left';
    }

    // Speech bubble
    if (ch.bubble) {
      const alpha = Math.min(1, ch.bubble.timer/500);
      ctx.save(); ctx.globalAlpha=alpha;
      drawBubble(ch.px, ch.py-5*S, ch.bubble.text);
      ctx.restore();
    }
  }

  ctx.restore();
  drawPipelineOverlay();
}

function drawBubble(x, y, text) {
  ctx.font = `${2*S}px "Courier New", monospace`;
  const tw = ctx.measureText(text).width;
  const bw=tw+4*S, bh=4*S;
  const bx=x+4*S-bw/2, by=y-bh-S;
  ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#555'; ctx.lineWidth=S*0.5;
  ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.fillRect(x+4*S,by+bh,S,S);
  ctx.fillStyle='#1a1a1a'; ctx.fillText(text,bx+2*S,by+3*S);
}

// ─── Pipeline Overlay ─────────────────────────────────────────────────────────
const PIPE_STAGES = ['Hear','Clean','Analyse','Task','Execute','Done'];

function drawPipelineOverlay() {
  const n=PIPE_STAGES.length, sw=7*S, sh=3*S, gap=S, pad=2*S;
  const total=n*(sw+gap)-gap;
  const ox=canvas.width-total-pad*2;
  const oy=canvas.height-sh-pad*2;

  ctx.fillStyle='rgba(10,6,2,0.72)';
  ctx.fillRect(ox-pad, oy-pad, total+pad*2, sh+pad*2);

  for (let i=0; i<n; i++) {
    const active = pipeline.stage===i+1;
    const done   = pipeline.stage>i+1;
    const x = ox+i*(sw+gap);
    ctx.fillStyle = done?'#2d6a4f' : active?'#7c3aed' : '#2a1f1a';
    ctx.fillRect(x,oy,sw,sh);
    if (active) { ctx.fillStyle='rgba(167,139,250,0.35)'; ctx.fillRect(x,oy,sw,sh); }
    ctx.font=`${S+1}px "Courier New", monospace`;
    ctx.textAlign='center';
    ctx.fillStyle = done?'#74c69d' : active?'#e9d5ff' : '#6b4a35';
    ctx.fillText(PIPE_STAGES[i], x+sw/2, oy+2*S);
    ctx.textAlign='left';
  }

  if (pipeline.taskTitle && pipeline.stage>=4) {
    ctx.font=`${2*S}px "Courier New", monospace`;
    ctx.fillStyle='rgba(245,216,154,0.9)';
    const label=pipeline.taskTitle.length>22
      ? pipeline.taskTitle.substring(0,21)+'...'
      : pipeline.taskTitle;
    ctx.fillText(label, ox-pad, oy-pad-S);
  }
}

// ─── Main Loop ────────────────────────────────────────────────────────────────
let lastTime=0;
function loop(ts) {
  const dt = Math.min(ts-lastTime, 50); lastTime=ts;

  cam.x += (cam.targetX-cam.x)*0.1;
  cam.y += (cam.targetY-cam.y)*0.1;

  if (pipeline.stageTimer>0) {
    pipeline.stageTimer-=dt;
    if (pipeline.stageTimer<=0 && pipeline.stage===6) pipeline.stage=0;
  }

  CHARS.forEach(ch=>updateChar(ch,dt));
  drawWorld();
  requestAnimationFrame(loop);
}

// ─── Input ────────────────────────────────────────────────────────────────────
function resize() {
  canvas.width=window.innerWidth; canvas.height=window.innerHeight; clampCam();
}
window.addEventListener('resize', resize);

canvas.addEventListener('mousedown', e => {
  drag.active=true; drag.startX=e.clientX; drag.startY=e.clientY;
  drag.cx=cam.targetX; drag.cy=cam.targetY;
});
canvas.addEventListener('mousemove', e => {
  if (!drag.active) return;
  cam.targetX=drag.cx-(e.clientX-drag.startX);
  cam.targetY=drag.cy-(e.clientY-drag.startY);
  clampCam();
});
canvas.addEventListener('mouseup',    ()=>{ drag.active=false; });
canvas.addEventListener('mouseleave', ()=>{ drag.active=false; });
canvas.addEventListener('dblclick',   ()=>window.focusOn('dot'));

// ─── Init ─────────────────────────────────────────────────────────────────────
resize();
initMap();

// Start camera centred on Mission Control
cam.targetX = 4.5*TW*S - canvas.width/2;
cam.targetY = 9*TH*S   - canvas.height/2;
clampCam();
cam.x=cam.targetX; cam.y=cam.targetY;

CHARS.forEach(ch => { ch.state='work'; ch.stateTimer=800; });

requestAnimationFrame(ts => { lastTime=ts; loop(ts); });

// Notify Swift host
try { window.webkit.messageHandlers.worldBridge.postMessage({type:'ready'}); } catch(_){}
</script>
