<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoClawd HQ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #090b16;
    }
    #root { position: relative; display: flex; align-items: center; justify-content: center; }
    #bg {
      position: absolute;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #overlay {
      position: absolute;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
    }
  </style>
  <script src="./adapter.js"></script>
</head>
<body>
  <div id="root">
    <img id="bg" src="./background.png" />
    <canvas id="overlay"></canvas>
  </div>
  <script src="./game.js"></script>
</body>
</html>
